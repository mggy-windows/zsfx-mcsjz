<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>纸上繁星 - 导航主页</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, sans-serif;
        }
        body {
            background-color: #18191c; /* B站深色背景 */
            color: #e5e9ef;
        }
        /* 顶部导航栏 */
        .header {
            background-color: #fb7299;
            display: flex;
            align-items: center;
            padding: 14px 24px;
            gap:16px;
        }
        .title-main{
            font-size:24px;
            font-weight:bold;
            color:white;
        }
        .title-sub{
            font-size:14px;
            color:#fff8f8;
        }
        .star-img-area{
            display:flex;
            flex-direction:column;
            align-items:center;
            margin-left:20px;
        }
        /* CSS绘制黑色像素五角星，不再用图片文件 */
        .pixel-star{
            width:42px;
            height:42px;
            background: #000;
            clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
            image-rendering: pixelated;
        }
        .star-text{
            color:#ffd700;
            font-size:18px;
            margin-top:3px;
        }
        /* 搜索区域 */
        .search-wrap{
            max-width:700px;
            margin:30px auto;
            display:flex;
            gap:8px;
            padding:0 20px;
        }
        #search-input{
            flex:1;
            padding:10px 16px;
            border-radius:6px;
            border:none;
            font-size:16px;
            background:#2b2c31;
            color:#fff;
        }
        .search-btn{
            padding:0 18px;
            border-radius:6px;
            border:none;
            background:#fb7299;
            color:white;
            cursor:pointer;
        }
        /* 导航卡片容器 */
        .container{
            max-width:1000px;
            margin:0 auto 60px;
            padding:0 20px;
        }
        .nav-title{
            font-size:20px;
            margin-bottom:22px;
            display:flex;
            align-items:center;
            gap:8px;
        }
        .nav-title::before{
            content:"";
            width:4px;
            height:20px;
            background:#fb7299;
        }
        .card-grid{
            display:grid;
            grid-template-columns: repeat(auto-fill, minmax(140px,1fr));
            gap:18px;
        }
        .card{
            background:#242529;
            border-radius:10px;
            padding:20px 10px;
            text-align:center;
            transition: 0.25s ease;
            cursor:pointer;
            text-decoration:none;
            color:#e5e9ef;
        }
        .card:hover{
            transform: translateY(-4px);
            background:#2f3035;
            box-shadow:0 6px 14px #00000044;
        }
        .card-icon{
            font-size:28px;
            margin-bottom:10px;
        }
        /* 底部版权 */
        footer{
            text-align:center;
            padding:30px;
            color:#888;
            font-size:14px;
        }
    </style>
</head>
<body>
    <div class="header">
        <div>

            <span class="title-sub"> 哔哩哔哩关注马哥工业回血</span>
        </div>
        <div class="star-img-area">
    <div style="position:relative;width:48px;height:48px;">
        <div class="pixel-star" style="width:48px;height:48px;"></div>
        <!-- 铅笔放在五角星右上角，笔尖朝下 -->
        <div style="position:absolute; right:-12px; top:-6px; font-size:32px; transform: rotate(-35deg);">✏️</div>
    </div>
    <div class="star-text">⭐⭐⭐⭐⭐</div>
</div>


    </div>

    </div>
    <footer>
        ©2026 马哥工业 | 个人导航主页，仅供??使用

    <script>
        function searchBaidu(){
            let kw = document.getElementById("search-input").value.trim();
            if(kw) window.open("https://www.baidu.com/s?wd="+encodeURIComponent(kw));
        }
        function searchBing(){
            let kw = document.getElementById("search-input").value.trim();
            if(kw) window.open("https://cn.bing.com/search?q="+encodeURIComponent(kw));
        }
    </script>
